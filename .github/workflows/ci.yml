name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: development
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: our_website_ci
      JWT_SECRET: ci-secret-key
      REACT_APP_BACKEND_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start API server
        run: |
          nohup uvicorn server:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
        working-directory: backend

      - name: Wait for API health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/backend.log
          exit 1

      - name: Seed test data
        run: curl -fsS -X POST http://127.0.0.1:8000/api/seed

      - name: Run backend test suite
        run: pytest -q backend/tests

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    env:
      CI: true
      REACT_APP_API_URL: http://127.0.0.1:8000/api/v1
      REACT_APP_APP_URL: http://127.0.0.1:3000
      REACT_APP_GA4_ID: ''
      REACT_APP_META_PIXEL_ID: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: yarn build
        working-directory: frontend
